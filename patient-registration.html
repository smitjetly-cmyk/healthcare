<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>SMIT Clinical Lab - Home</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./sidebar.css">
    <link rel="stylesheet" href="./layout.css">
    <link rel="stylesheet" href="./effects.css">

</head>
<body>

  <header>
    <h1>Smit Clinical Labs</h1>
    <p>Accurate Diagnostics for Better Healthcare</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="laboratory-tests.html">Laboratory Tests</a>
    <a href="test-price-table.html">Health Packages</a>
    <a href="patient-registration.html">Online Registration</a>
    <a href="health-information.html">Reports</a>
    <a href="index.html#contact">Contact Us</a>
  </nav>

  <main>
    <section>
      <h2>Online Patient Registration Form</h2>
      <article>
        <form action="#" method="post">

          <fieldset>
            <legend>Personal Details</legend>

            <label for="pname">Patient Name</label>
            <input type="text" id="pname" name="patient_name" placeholder="Enter full name" required autofocus>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="120" placeholder="Enter age" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">-- Select Gender --</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number"
                   pattern="[0-9]{10}" title="Enter a valid 10-digit mobile number" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
          </fieldset>

          <fieldset>
            <legend>Test &amp; Appointment Details</legend>

            <label for="test">Test Selection</label>
            <select id="test" name="test_selection" required>
              <option value="">-- Select Test --</option>
              <option value="cbc">Complete Blood Count (CBC)</option>
              <option value="urine">Urine Routine &amp; Microscopy</option>
              <option value="thyroid">Thyroid Profile</option>
              <option value="lft">Liver Function Test</option>
              <option value="kft">Kidney Function Test</option>
              <option value="lipid">Lipid Profile</option>
              <option value="hba1c">HbA1c</option>
            </select>

            <label for="appt-date">Preferred Appointment Date</label>
            <input type="date" id="appt-date" name="appointment_date" required>

            <label>Sample Collection Preference</label>
            <input type="radio" id="collect-home" name="collection" value="home" checked>
            <label for="collect-home" style="display:inline; font-weight:normal;">Home Collection</label><br>
            <input type="radio" id="collect-lab" name="collection" value="lab">
            <label for="collect-lab" style="display:inline; font-weight:normal;">Visit Laboratory</label>

            <label for="prescription">Upload Doctor Prescription</label>
            <input type="file" id="prescription" name="prescription" accept=".pdf,.jpg,.png">
          </fieldset>

          <input type="submit" value="Submit Registration">
<input type="reset" value="Reset Form">
        </form>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Smit Clinical Labs. All Rights Reserved.</p>
  </footer>

</body>
</html>
